<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diskwala Links</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff;
  color:#111;
}

/* HEADER */

header{
  background:#fff;
  color:#111;
  padding:18px 10px 14px;
  text-align:center;
  border-bottom:1px solid #eee;
}

header h1{
  margin:0;
  font-size:24px;
  font-weight:700;
}

header p{
  margin:6px 0 0;
  color:#777;
  font-size:13px;
}

/* MAIN */

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:16px;
}

/* SEARCH */

.search{
  width:100%;
  padding:14px 16px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  outline:none;
  margin-bottom:20px;
  background:#fff;
}

.search:focus{
  border-color:#999;
}

/* GRID */

#videos{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:26px 18px;
}

/* VIDEO ITEM */

.video-item{
  width:100%;
  cursor:pointer;
  text-decoration:none;
  color:#111;
  display:block;
}

/* THUMBNAIL */

.thumb-wrap{
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:16px;
  background:#eee;
}

.thumb{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .2s ease;
}

.video-item:active .thumb{
  transform:scale(.98);
}

/* TITLE */

.title{
  text-align:center;
  font-size:18px;
  font-weight:700;
  margin-top:14px;
  line-height:1.25;
}

/* OPTIONAL SLUG */

.slug{
  text-align:center;
  color:#777;
  font-size:13px;
  margin-top:5px;
}

/* LOADING */

.loading,
.empty{
  grid-column:1 / -1;
  text-align:center;
  padding:50px 10px;
  color:#777;
}

/* ERROR */

.error{
  grid-column:1 / -1;
  background:#ffe5e5;
  color:#b00020;
  padding:15px;
  border-radius:12px;
  text-align:center;
}

/* MOBILE */

@media(max-width:500px){

  .container{
    padding:16px;
  }

  #videos{
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:26px 16px;
  }

  .title{
    font-size:17px;
  }

  .slug{
    font-size:12px;
  }

}

/* VERY SMALL PHONES */

@media(max-width:350px){

  .container{
    padding:12px;
  }

  #videos{
    gap:22px 10px;
  }

  .title{
    font-size:15px;
  }

}

</style>

</head>

<body>

<header>

  <h1>Diskwala Links</h1>

  <p>Watch your videos</p>

</header>


<div class="container">

  <input
    id="search"
    class="search"
    type="text"
    placeholder="Search videos..."
  >

  <div id="videos">

    <div class="loading">
      Loading videos...
    </div>

  </div>

</div>


<script>

/* SUPABASE */

const SUPABASE_URL =
"https://tmwzrmqtajwyocdzdzus.supabase.co";

const SUPABASE_KEY =
"sb_publishable_6NluK0UVqW31Kve-ADGXNg_GPprXmiz";

const client =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let allVideos = [];


/* LOAD VIDEOS */

async function loadVideos(){

  const videos =
    document.getElementById("videos");

  videos.innerHTML = `
    <div class="loading">
      Loading videos...
    </div>
  `;


  const { data, error } = await client

    .from("diskwala_links")

    .select(
      "id,slug,title,thumbnail_url,diskwala_url,created_at"
    )

    /* NEWEST FIRST */

    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(error);

    videos.innerHTML = `
      <div class="error">
        Unable to load videos.<br>
        Please check Supabase.
      </div>
    `;

    return;
  }


  allVideos = data || [];


  if(allVideos.length === 0){

    videos.innerHTML = `
      <div class="empty">
        No videos available.
      </div>
    `;

    return;
  }


  displayVideos(allVideos);

}


/* DISPLAY VIDEOS */

function displayVideos(list){

  const videos =
    document.getElementById("videos");

  videos.innerHTML = "";


  list.forEach((video,index) => {

    const title =
      video.title ||
      `Video ${list.length - index}`;


    const slug =
      video.slug || "";


    const thumbnail =
      video.thumbnail_url ||
      "https://via.placeholder.com/800x450?text=Diskwala";


    const link =
      video.diskwala_url || "";


    const validLink =
      link.startsWith(
        "https://www.diskwala.com/app/"
      );


    if(!validLink){

      return;

    }


    const item =
      document.createElement("a");

    item.className =
      "video-item";

    item.href =
      link;


    item.innerHTML = `

      <div class="thumb-wrap">

        <img
          class="thumb"
          src="${escapeHtml(thumbnail)}"
          alt="${escapeHtml(title)}"
          loading="lazy"
          onerror="
            this.src='https://via.placeholder.com/800x450?text=No+Thumbnail'
          "
        >

      </div>

      <div class="title">
        ${escapeHtml(title)}
      </div>

      ${
        slug
        ? `
          <div class="slug">
            ${escapeHtml(slug)}
          </div>
        `
        : ""
      }

    `;


    videos.appendChild(item);

  });


  if(videos.children.length === 0){

    videos.innerHTML = `
      <div class="empty">
        No valid videos found.
      </div>
    `;

  }

}


/* SEARCH */

function filterVideos(){

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  if(!search){

    displayVideos(allVideos);

    return;

  }


  const filtered =
    allVideos.filter(video => {

      const title =
        (video.title || "")
        .toLowerCase();


      const slug =
        (video.slug || "")
        .toLowerCase();


      return (
        title.includes(search) ||
        slug.includes(search)
      );

    });


  if(filtered.length === 0){

    document.getElementById("videos").innerHTML = `

      <div class="empty">
        No videos found.
      </div>

    `;

    return;

  }


  displayVideos(filtered);

}


/* SECURITY */

function escapeHtml(text){

  const div =
    document.createElement("div");

  div.textContent =
    text == null
      ? ""
      : String(text);

  return div.innerHTML;

}


/* SEARCH EVENT */

document
  .getElementById("search")
  .addEventListener(
    "input",
    filterVideos
  );


/* START */

loadVideos();

</script>

</body>
</html>
